name: Test, gate and deploy demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Regression gate on the shipped candidate
        run: npm run gate:ci
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect static site
        run: |
          mkdir -p _site/src _site/candidates _site/data _site/docs
          cp index.html app.js eval.config.json _site/
          cp src/*.js _site/src/
          cp candidates/*.js _site/candidates/
          cp data/*.jsonl _site/data/
          cp docs/*.png docs/results.json _site/docs/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
